<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 - Monitor Orologi Attività</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #0b0e14;
      color: #e1e6ed;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 30px 20px;
      box-sizing: border-box;
    }
    header {
      text-align: center;
      margin-bottom: 35px;
    }
    h1 {
      font-size: 1.8rem;
      color: #38ef7d;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0 0 10px 0;
    }
    p.subtitle {
      color: #788ba6;
      font-size: 0.95rem;
      margin: 0 0 18px 0;
    }
    .drive-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #1a212d;
      color: #38ef7d;
      border: 1px solid #38ef7d;
      padding: 8px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .drive-link-btn:hover {
      background-color: #38ef7d;
      color: #0b0e14;
      box-shadow: 0 0 12px rgba(56, 239, 125, 0.4);
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 25px;
      max-width: 1300px;
      margin: 0 auto;
    }
    .clock-card {
      background: #121721;
      border: 1px solid #212936;
      border-radius: 20px;
      padding: 25px 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    .date-badge {
      display: inline-block;
      background: #1a212d;
      color: #58a6ff;
      border: 1px solid #2a3446;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    .chart-container {
      position: relative;
      width: 230px;
      height: 230px;
      margin: 0 auto;
    }
    .chart-center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.3rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255,255,255,0.2);
    }
    .chart-center-subtext {
      font-size: 0.7rem;
      color: #788ba6;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .loading-state {
      text-align: center;
      font-size: 1.2rem;
      color: #788ba6;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <header>
    <h1>ESP32 - Monitor Orologi Attività</h1>
    <p class="subtitle">Visualizzazione dinamica sessioni da Google Drive</p>
    
    <!-- Link al foglio Google Sheets RAW_LOGS -->
    <a href="https://docs.google.com/spreadsheets/d/1bSqmSoxX1J5v1PqdbkUduWvj497rD2CiM44H181ezSk/edit?usp=sharing" target="_blank" rel="noopener noreferrer" class="drive-link-btn">
      📊 APRI FOGLIO RAW_LOGS
    </a>
  </header>

  <div id="loading" class="loading-state">Lettura dati dal foglio in corso...</div>
  <div id="clocksGrid" class="grid-container"></div>

  <script>
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzv_3rDgWIRFjMB8kEwDuTf2FSs8_0BBiw3CjwY-mew4vzMY3OqYMcO0vWB6uWl5wpt/exec?get_data=true";

    function loadDataFromDrive() {
      const oldScript = document.getElementById('jsonp-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'jsonp-script';
      script.src = WEBHOOK_URL + "&callback=renderAllClocks&t=" + new Date().getTime();
      document.body.appendChild(script);
    }

    function renderAllClocks(data) {
      document.getElementById("loading").style.display = "none";
      const grid = document.getElementById("clocksGrid");
      grid.innerHTML = "";

      const dailyMap = {};

      for (let i = 1; i < data.length; i++) {
        const rowDate = String(data[i][0]).trim();        // Col A: DATA
        const startTimeStr = String(data[i][1]).trim();   // Col B: ORA ACCENSIONE
        const endTimeStr = String(data[i][2]).trim();     // Col C: ULTIMO SEGNALE
        const activeMins = parseInt(data[i][3], 10) || 0; // Col D: MINUTI ATTIVI

        if (rowDate && !rowDate.includes("TOTALE") && rowDate !== "DATA") {
          if (!dailyMap[rowDate]) {
            dailyMap[rowDate] = {
              hourly: new Array(24).fill(false),
              totalMins: 0
            };
          }

          dailyMap[rowDate].totalMins += activeMins;

          if (startTimeStr && endTimeStr && startTimeStr.length >= 5 && endTimeStr.length >= 5) {
            const startHour = parseInt(startTimeStr.split(":")[0], 10);
            const endHour = parseInt(endTimeStr.split(":")[0], 10);

            if (!isNaN(startHour) && !isNaN(endHour)) {
              for (let h = startHour; h <= endHour; h++) {
                if (h >= 0 && h < 24) {
                  dailyMap[rowDate].hourly[h] = true;
                }
              }
            }
          }
        }
      }

      const sortedDates = Object.keys(dailyMap).reverse();

      if (sortedDates.length === 0) {
        grid.innerHTML = "<div class='loading-state'>Nessun dato valido trovato nel foglio.</div>";
        return;
      }

      sortedDates.forEach((dateKey, index) => {
        const dayData = dailyMap[dateKey];
        const hrs = Math.floor(dayData.totalMins / 60);
        const mins = dayData.totalMins % 60;

        const card = document.createElement("div");
        card.className = "clock-card";
        card.innerHTML = `
          <div class="date-badge">GIORNO: ${dateKey}</div>
          <div class="chart-container">
            <canvas id="clockCanvas_${index}"></canvas>
            <div class="chart-center-text">
              ${hrs}h ${mins}m
              <div class="chart-center-subtext">Tempo Attivo</div>
            </div>
          </div>
        `;
        grid.appendChild(card);

        const bgColors = dayData.hourly.map(isActive => isActive ? '#38ef7d' : '#1a212d');
        const labels = Array.from({length: 24}, (_, i) => `${i.toString().padStart(2, '0')}:00`);

        const ctx = document.getElementById(`clockCanvas_${index}`).getContext('2d');
        new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: labels,
            datasets: [{
              data: new Array(24).fill(1),
              backgroundColor: bgColors,
              borderWidth: 2,
              borderColor: '#121721'
            }]
          },
          options: {
            cutout: '72%',
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: function(ctx) {
                    const hour = ctx.dataIndex;
                    const status = dayData.hourly[hour] ? "ATTIVO" : "INATTIVO";
                    return ` Ora ${hour}:00 - Status: ${status}`;
                  }
                }
              }
            }
          }
        });
      });
    }

    loadDataFromDrive();
    setInterval(loadDataFromDrive, 30000);
  </script>
</body>
</html>
