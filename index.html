<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 - Monitor & Analytics Attività</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #0b0e14;
      color: #e1e6ed;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 30px 20px;
      box-sizing: border-box;
    }
    header {
      text-align: center;
      margin-bottom: 35px;
    }
    h1 {
      font-size: 1.8rem;
      color: #38ef7d;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0 0 10px 0;
    }
    p.subtitle {
      color: #788ba6;
      font-size: 0.95rem;
      margin: 0 0 18px 0;
    }
    .drive-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #1a212d;
      color: #38ef7d;
      border: 1px solid #38ef7d;
      padding: 8px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .drive-link-btn:hover {
      background-color: #38ef7d;
      color: #0b0e14;
      box-shadow: 0 0 12px rgba(56, 239, 125, 0.4);
    }
    
    .analytics-section {
      max-width: 1300px;
      margin: 0 auto 40px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
    }
    .analytics-card {
      background: #121721;
      border: 1px solid #212936;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .analytics-title {
      font-size: 1.05rem;
      color: #58a6ff;
      font-weight: bold;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }

    .section-title {
      max-width: 1300px;
      margin: 0 auto 20px auto;
      font-size: 1.2rem;
      color: #ffffff;
      border-bottom: 1px solid #212936;
      padding-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .grid-container {
      display: flex;
      flex-direction: column;
      gap: 30px;
      max-width: 1300px;
      margin: 0 auto;
    }
    .day-card {
      background: #121721;
      border: 1px solid #212936;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 1px solid #1a212d;
      padding-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .date-badge {
      background: #1a212d;
      color: #58a6ff;
      border: 1px solid #2a3446;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .day-total-badge {
      color: #38ef7d;
      font-weight: 600;
      font-size: 1rem;
    }

    .clocks-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }
    .clock-box {
      background: #0b0e14;
      border: 1px solid #1f2733;
      border-radius: 16px;
      padding: 15px;
      text-align: center;
    }
    .clock-title {
      font-size: 0.85rem;
      color: #788ba6;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    .chart-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto;
    }
    .chart-center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255,255,255,0.2);
    }

    .fasce-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      background: #0b0e14;
      border-radius: 12px;
      padding: 15px;
      border: 1px solid #1f2733;
    }
    .fascia-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .fascia-label {
      font-size: 0.78rem;
      color: #788ba6;
      text-transform: uppercase;
      font-weight: 600;
    }
    .fascia-val {
      font-size: 1rem;
      color: #e1e6ed;
      font-weight: bold;
    }
    .fascia-bar-bg {
      height: 6px;
      background: #1a212d;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 2px;
    }
    .fascia-bar-fill {
      height: 100%;
      border-radius: 3px;
    }

    .loading-state {
      text-align: center;
      font-size: 1.1rem;
      color: #788ba6;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <header>
    <h1>ESP32 - Monitor & Analytics Attività</h1>
    <p class="subtitle">Analisi utilizzo e orologi grafici in tempo reale da Google Drive</p>
    
    <a href="https://docs.google.com/spreadsheets/d/1bSqmSoxX1J5v1PqdbkUduWvj497rD2CiM44H181ezSk/edit?gid=211746529#gid=211746529" target="_blank" rel="noopener noreferrer" class="drive-link-btn">
      📊 APRI FOGLIO RAW_LOGS
    </a>
  </header>

  <div id="loading" class="loading-state">Connessione e caricamento dati in corso...</div>

  <div id="analyticsWrapper" style="display: none;">
    <div class="analytics-section">
      <div class="analytics-card">
        <div class="analytics-title">Ore Attive per Giorno (Totale)</div>
        <canvas id="barChartDays"></canvas>
      </div>
      <div class="analytics-card">
        <div class="analytics-title">Ripartizione Utilizzo Complessiva per Fasce</div>
        <canvas id="pieChartFasce"></canvas>
      </div>
    </div>

    <div class="section-title">Orologi Giornalieri & Ripartizione Fasce</div>
    <div id="clocksGrid" class="grid-container"></div>
  </div>

  <script>
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzv_3rDgWIRFjMB8kEwDuTf2FSs8_0BBiw3CjwY-mew4vzMY3OqYMcO0vWB6uWl5wpt/exec?get_data=true";

    let barChartInstance = null;
    let pieChartInstance = null;

    function loadDataFromDrive() {
      const oldScript = document.getElementById('jsonp-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'jsonp-script';
      script.src = WEBHOOK_URL + "&callback=processAndRender&t=" + new Date().getTime();
      document.body.appendChild(script);
    }

    function parseHour(timeStr) {
      if (!timeStr) return -1;
      let str = String(timeStr).trim();
      if (str.includes("T")) str = str.split("T")[1];
      const parts = str.split(":");
      if (parts.length >= 1) {
        const h = parseInt(parts[0], 10);
        if (!isNaN(h) && h >= 0 && h < 24) return h;
      }
      return -1;
    }

    function parseDate(dateVal) {
      if (!dateVal) return "";
      let str = String(dateVal).trim();
      if (str.includes("T")) str = str.split("T")[0];
      return str;
    }

    function processAndRender(data) {
      document.getElementById("loading").style.display = "none";
      document.getElementById("analyticsWrapper").style.display = "block";

      if (!data || !Array.isArray(data) || data.length < 2) return;

      const dailyMap = {};

      for (let i = 1; i < data.length; i++) {
        const rowDate = parseDate(data[i][0]);
        const startTimeStr = String(data[i][1] || "");
        const endTimeStr = String(data[i][2] || "");
        const activeMins = parseInt(data[i][3], 10) || 0;

        if (rowDate && !rowDate.includes("TOTALE") && rowDate !== "DATA") {
          if (!dailyMap[rowDate]) {
            dailyMap[rowDate] = {
              hourly: new Array(24).fill(false),
              totalMins: 0
            };
          }

          dailyMap[rowDate].totalMins += activeMins;

          const startHour = parseHour(startTimeStr);
          const endHour = parseHour(endTimeStr);

          if (startHour !== -1 && endHour !== -1) {
            for (let h = startHour; h <= endHour; h++) {
              if (h >= 0 && h < 24) {
                dailyMap[rowDate].hourly[h] = true;
              }
            }
          }
        }
      }

      const sortedDates = Object.keys(dailyMap).sort();

      renderAnalyticsCharts(sortedDates, dailyMap);
      renderClockCards(sortedDates.slice().reverse(), dailyMap);
    }

    function renderAnalyticsCharts(dates, dailyMap) {
      const labelsDays = dates;
      const dataHoursDays = dates.map(d => (dailyMap[d].totalMins / 60).toFixed(1));

      if (barChartInstance) barChartInstance.destroy();
      const ctxBar = document.getElementById('barChartDays').getContext('2d');
      barChartInstance = new Chart(ctxBar, {
        type: 'bar',
        data: {
          labels: labelsDays,
          datasets: [{
            label: 'Ore Attive',
            data: dataHoursDays,
            backgroundColor: '#38ef7d',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#788ba6' }, grid: { color: '#1a212d' } },
            y: { ticks: { color: '#788ba6' }, grid: { color: '#1a212d' } }
          }
        }
      });

      let notte = 0, mattina = 0, pomeriggio = 0, sera = 0;

      dates.forEach(d => {
        dailyMap[d].hourly.forEach((isActive, hour) => {
          if (isActive) {
            if (hour >= 0 && hour < 6) notte++;
            else if (hour >= 6 && hour < 12) mattina++;
            else if (hour >= 12 && hour < 18) pomeriggio++;
            else sera++;
          }
        });
      });

      if (pieChartInstance) pieChartInstance.destroy();
      const ctxPie = document.getElementById('pieChartFasce').getContext('2d');
      pieChartInstance = new Chart(ctxPie, {
        type: 'pie',
        data: {
          labels: ['Notte (00-06)', 'Mattina (06-12)', 'Pomeriggio (12-18)', 'Sera (18-24)'],
          datasets: [{
            data: [notte, mattina, pomeriggio, sera],
            backgroundColor: ['#11998e', '#38ef7d', '#58a6ff', '#d29922']
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { labels: { color: '#e1e6ed' } }
          }
        }
      });
    }

    function createDoughnutSafely(canvasId, bgColors, labels) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: new Array(labels.length).fill(1),
            backgroundColor: bgColors,
            borderWidth: 2,
            borderColor: '#0b0e14'
          }]
        },
        options: {
          cutout: '72%',
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(ctx) {
                  const isAct = bgColors[ctx.dataIndex] !== '#1a212d';
                  return ` ${labels[ctx.dataIndex]} - ${isAct ? 'ATTIVO' : 'INATTIVO'}`;
                }
              }
            }
          }
        }
      });
    }

    function renderClockCards(datesReversed, dailyMap) {
      const grid = document.getElementById("clocksGrid");
      grid.innerHTML = "";

      datesReversed.forEach((dateKey, index) => {
        const dayData = dailyMap[dateKey];
        const hrs = Math.floor(dayData.totalMins / 60);
        const mins = dayData.totalMins % 60;

        let countNotte = 0, countMattina = 0, countPomeriggio = 0, countSera = 0;
        dayData.hourly.forEach((isActive, h) => {
          if (isActive) {
            if (h >= 0 && h < 6) countNotte++;
            else if (h >= 6 && h < 12) countMattina++;
            else if (h >= 12 && h < 18) countPomeriggio++;
            else countSera++;
          }
        });

        const dayCard = document.createElement("div");
        dayCard.className = "day-card";
        dayCard.innerHTML = `
          <div class="day-header">
            <div class="date-badge">GIORNO: ${dateKey}</div>
            <div class="day-total-badge">Tempo Totale Attivo: ${hrs}h ${mins}m</div>
          </div>

          <div class="clocks-row">
            <div class="clock-box">
              <div class="clock-title">Orologio 24 Ore</div>
              <div class="chart-container">
                <canvas id="clock24_${index}"></canvas>
                <div class="chart-center-text">${hrs}h ${mins}m</div>
              </div>
            </div>

            <div class="clock-box">
              <div class="clock-title">Diurno (06:00 - 18:00)</div>
              <div class="chart-container">
                <canvas id="clockDay_${index}"></canvas>
                <div class="chart-center-text" style="color: #38ef7d;">${countMattina + countPomeriggio}h</div>
              </div>
            </div>

            <div class="clock-box">
              <div class="clock-title">Notturno (18:00 - 06:00)</div>
              <div class="chart-container">
                <canvas id="clockNight_${index}"></canvas>
                <div class="chart-center-text" style="color: #58a6ff;">${countNotte + countSera}h</div>
              </div>
            </div>
          </div>

          <div class="fasce-grid">
            <div class="fascia-item">
              <div class="fascia-label">🌙 Notte (00:00 - 06:00)</div>
              <div class="fascia-val">${countNotte} Ore Attive</div>
              <div class="fascia-bar-bg"><div class="fascia-bar-fill" style="width: ${(countNotte/6)*100}%; background: #11998e;"></div></div>
            </div>
            <div class="fascia-item">
              <div class="fascia-label">🌅 Mattina (06:00 - 12:00)</div>
              <div class="fascia-val">${countMattina} Ore Attive</div>
              <div class="fascia-bar-bg"><div class="fascia-bar-fill" style="width: ${(countMattina/6)*100}%; background: #38ef7d;"></div></div>
            </div>
            <div class="fascia-item">
              <div class="fascia-label">☀️ Pomeriggio (12:00 - 18:00)</div>
              <div class="fascia-val">${countPomeriggio} Ore Attive</div>
              <div class="fascia-bar-bg"><div class="fascia-bar-fill" style="width: ${(countPomeriggio/6)*100}%; background: #58a6ff;"></div></div>
            </div>
            <div class="fascia-item">
              <div class="fascia-label">🌆 Sera (18:00 - 24:00)</div>
              <div class="fascia-val">${countSera} Ore Attive</div>
              <div class="fascia-bar-bg"><div class="fascia-bar-fill" style="width: ${(countSera/6)*100}%; background: #d29922;"></div></div>
            </div>
          </div>
        `;
        grid.appendChild(dayCard);

        // Rendering sicuro di ciascun grafico dopo che l'HTML è stato iniettato nel DOM
        const colors24 = dayData.hourly.map(a => a ? '#38ef7d' : '#1a212d');
        createDoughnutSafely(`clock24_${index}`, colors24, Array.from({length: 24}, (_, i) => `${i.toString().padStart(2, '0')}:00`));

        const hourlyDay = dayData.hourly.slice(6, 18);
        const colorsDay = hourlyDay.map(a => a ? '#38ef7d' : '#1a212d');
        const labelsDay = Array.from({length: 12}, (_, i) => `${(i + 6).toString().padStart(2, '0')}:00`);
        createDoughnutSafely(`clockDay_${index}`, colorsDay, labelsDay);

        const hourlyNight = [...dayData.hourly.slice(18, 24), ...dayData.hourly.slice(0, 6)];
        const colorsNight = hourlyNight.map(a => a ? '#58a6ff' : '#1a212d');
        const labelsNight = Array.from({length: 12}, (_, i) => {
          const h = (i + 18) % 24;
          return `${h.toString().padStart(2, '0')}:00`;
        });
        createDoughnutSafely(`clockNight_${index}`, colorsNight, labelsNight);
      });
    }

    loadDataFromDrive();
    setInterval(loadDataFromDrive, 30000);
  </script>
</body>
</html>
