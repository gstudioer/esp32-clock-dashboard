<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 - Monitor & Analytics Attività</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #0b0e14;
      color: #e1e6ed;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 30px 20px;
      box-sizing: border-box;
    }
    header {
      text-align: center;
      margin-bottom: 35px;
    }
    h1 {
      font-size: 1.8rem;
      color: #38ef7d;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0 0 10px 0;
    }
    p.subtitle {
      color: #788ba6;
      font-size: 0.95rem;
      margin: 0 0 18px 0;
    }
    .drive-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #1a212d;
      color: #38ef7d;
      border: 1px solid #38ef7d;
      padding: 8px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .drive-link-btn:hover {
      background-color: #38ef7d;
      color: #0b0e14;
      box-shadow: 0 0 12px rgba(56, 239, 125, 0.4);
    }
    
    .analytics-section {
      max-width: 1300px;
      margin: 0 auto 40px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
    }
    .analytics-card {
      background: #121721;
      border: 1px solid #212936;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .analytics-title {
      font-size: 1.05rem;
      color: #58a6ff;
      font-weight: bold;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }

    .section-title {
      max-width: 1300px;
      margin: 0 auto 20px auto;
      font-size: 1.2rem;
      color: #ffffff;
      border-bottom: 1px solid #212936;
      padding-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
      max-width: 1300px;
      margin: 0 auto;
    }
    .clock-card {
      background: #121721;
      border: 1px solid #212936;
      border-radius: 20px;
      padding: 25px 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    .date-badge {
      display: inline-block;
      background: #1a212d;
      color: #58a6ff;
      border: 1px solid #2a3446;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    .chart-container {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto;
    }
    .chart-center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.3rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255,255,255,0.2);
    }
    .chart-center-subtext {
      font-size: 0.7rem;
      color: #788ba6;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .loading-state {
      text-align: center;
      font-size: 1.1rem;
      color: #788ba6;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <header>
    <h1>ESP32 - Monitor & Analytics Attività</h1>
    <p class="subtitle">Analisi utilizzo e orologi grafici in tempo reale da Google Drive</p>
    
    <a href="https://docs.google.com/spreadsheets/d/1bSqmSoxX1J5v1PqdbkUduWvj497rD2CiM44H181ezSk/edit?usp=sharing" target="_blank" rel="noopener noreferrer" class="drive-link-btn">
      📊 APRI FOGLIO RAW_LOGS
    </a>
  </header>

  <div id="loading" class="loading-state">Connessione e caricamento dati in corso...</div>

  <div id="analyticsWrapper" style="display: none;">
    <div class="analytics-section">
      <div class="analytics-card">
        <div class="analytics-title">Ore Attive per Giorno (Totale)</div>
        <canvas id="barChartDays"></canvas>
      </div>
      <div class="analytics-card">
        <div class="analytics-title">Ripartizione Utilizzo per Fasce Orarie</div>
        <canvas id="pieChartFasce"></canvas>
      </div>
    </div>

    <div class="section-title">Orologi Giornalieri (24 Ore)</div>
    <div id="clocksGrid" class="grid-container"></div>
  </div>

  <script>
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzv_3rDgWIRFjMB8kEwDuTf2FSs8_0BBiw3CjwY-mew4vzMY3OqYMcO0vWB6uWl5wpt/exec?get_data=true";

    let barChartInstance = null;
    let pieChartInstance = null;

    // Connessione pulita via tag Script JSONP
    function loadDataFromDrive() {
      const oldScript = document.getElementById('jsonp-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'jsonp-script';
      script.src = WEBHOOK_URL + "&callback=processAndRender&t=" + new Date().getTime();
      document.body.appendChild(script);
    }

    // Estrae l'ora numerica
    function parseHour(timeStr) {
      if (!timeStr) return -1;
      let str = String(timeStr).trim();
      if (str.includes("T")) str = str.split("T")[1];
      const parts = str.split(":");
      if (parts.length >= 1) {
        const h = parseInt(parts[0], 10);
        if (!isNaN(h) && h >= 0 && h < 24) return h;
      }
      return -1;
    }

    // Estrae la data YYYY-MM-DD
    function parseDate(dateVal) {
      if (!dateVal) return "";
      let str = String(dateVal).trim();
      if (str.includes("T")) str = str.split("T")[0];
      return str;
    }

    // Funzione richiamata automaticamente dal Webhook Google
    function processAndRender(data) {
      document.getElementById("loading").style.display = "none";
      document.getElementById("analyticsWrapper").style.display = "block";

      if (!data || !Array.isArray(data) || data.length < 2) return;

      const dailyMap = {};

      for (let i = 1; i < data.length; i++) {
        const rowDate = parseDate(data[i][0]);
        const startTimeStr = String(data[i][1] || "");
        const endTimeStr = String(data[i][2] || "");
        const activeMins = parseInt(data[i][3], 10) || 0;

        if (rowDate && !rowDate.includes("TOTALE") && rowDate !== "DATA") {
          if (!dailyMap[rowDate]) {
            dailyMap[rowDate] = {
              hourly: new Array(24).fill(false),
              totalMins: 0
            };
          }

          dailyMap[rowDate].totalMins += activeMins;

          const startHour = parseHour(startTimeStr);
          const endHour = parseHour(endTimeStr);

          if (startHour !== -1 && endHour !== -1) {
            for (let h = startHour; h <= endHour; h++) {
              if (h >= 0 && h < 24) {
                dailyMap[rowDate].hourly[h] = true;
              }
            }
          }
        }
      }

      const sortedDates = Object.keys(dailyMap).sort();

      // 1. Grafici di Analisi
      renderAnalyticsCharts(sortedDates, dailyMap);

      // 2. Orologi 24 Ore
      renderClockCards(sortedDates.slice().reverse(), dailyMap);
    }

    function renderAnalyticsCharts(dates, dailyMap) {
      const labelsDays = dates;
      const dataHoursDays = dates.map(d => (dailyMap[d].totalMins / 60).toFixed(1));

      if (barChartInstance) barChartInstance.destroy();
      const ctxBar = document.getElementById('barChartDays').getContext('2d');
      barChartInstance = new Chart(ctxBar, {
        type: 'bar',
        data: {
          labels: labelsDays,
          datasets: [{
            label: 'Ore Attive',
            data: dataHoursDays,
            backgroundColor: '#38ef7d',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#788ba6' }, grid: { color: '#1a212d' } },
            y: { ticks: { color: '#788ba6' }, grid: { color: '#1a212d' } }
          }
        }
      });

      let notte = 0, mattina = 0, pomeriggio = 0, sera = 0;

      dates.forEach(d => {
        dailyMap[d].hourly.forEach((isActive, hour) => {
          if (isActive) {
            if (hour >= 0 && hour < 6) notte++;
            else if (hour >= 6 && hour < 12) mattina++;
            else if (hour >= 12 && hour < 18) pomeriggio++;
            else sera++;
          }
        });
      });

      if (pieChartInstance) pieChartInstance.destroy();
      const ctxPie = document.getElementById('pieChartFasce').getContext('2d');
      pieChartInstance = new Chart(ctxPie, {
        type: 'pie',
        data: {
          labels: ['Notte (00-06)', 'Mattina (06-12)', 'Pomeriggio (12-18)', 'Sera (18-24)'],
          datasets: [{
            data: [notte, mattina, pomeriggio, sera],
            backgroundColor: ['#11998e', '#38ef7d', '#58a6ff', '#d29922']
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { labels: { color: '#e1e6ed' } }
          }
        }
      });
    }

    function renderClockCards(datesReversed, dailyMap) {
      const grid = document.getElementById("clocksGrid");
      grid.innerHTML = "";

      datesReversed.forEach((dateKey, index) => {
        const dayData = dailyMap[dateKey];
        const hrs = Math.floor(dayData.totalMins / 60);
        const mins = dayData.totalMins % 60;

        const card = document.createElement("div");
        card.className = "clock-card";
        card.innerHTML = `
          <div class="date-badge">GIORNO: ${dateKey}</div>
          <div class="chart-container">
            <canvas id="clockCanvas_${index}"></canvas>
            <div class="chart-center-text">
              ${hrs}h ${mins}m
              <div class="chart-center-subtext">Tempo Attivo</div>
            </div>
          </div>
        `;
        grid.appendChild(card);

        const bgColors = dayData.hourly.map(isActive => isActive ? '#38ef7d' : '#1a212d');
        const labels = Array.from({length: 24}, (_, i) => `${i.toString().padStart(2, '0')}:00`);

        const ctx = document.getElementById(`clockCanvas_${index}`).getContext('2d');
        new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: labels,
            datasets: [{
              data: new Array(24).fill(1),
              backgroundColor: bgColors,
              borderWidth: 2,
              borderColor: '#121721'
            }]
          },
          options: {
            cutout: '72%',
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: function(ctx) {
                    const hour = ctx.dataIndex;
                    const status = dayData.hourly[hour] ? "ATTIVO" : "INATTIVO";
                    return ` Ora ${hour}:00 - Status: ${status}`;
                  }
                }
              }
            }
          }
        });
      });
    }

    // Avvio caricamento
    loadDataFromDrive();
    setInterval(loadDataFromDrive, 30000);
  </script>
</body>
</html>
