<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 - Monitor & Analytics Attività</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #0b0e14;
      color: #e1e6ed;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 30px 20px;
      box-sizing: border-box;
    }
    header {
      text-align: center;
      margin-bottom: 35px;
    }
    h1 {
      font-size: 1.8rem;
      color: #38ef7d;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0 0 10px 0;
    }
    p.subtitle {
      color: #788ba6;
      font-size: 0.95rem;
      margin: 0 0 18px 0;
    }
    .drive-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #1a212d;
      color: #38ef7d;
      border: 1px solid #38ef7d;
      padding: 8px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .drive-link-btn:hover {
      background-color: #38ef7d;
      color: #0b0e14;
      box-shadow: 0 0 12px rgba(56, 239, 125, 0.4);
    }
    
    /* Sezione Analisi Generale */
    .analytics-section {
      max-width: 1300px;
      margin: 0 auto 40px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
    }
    .analytics-card {
      background: #121721;
      border: 1px solid #212936;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .analytics-title {
      font-size: 1.05rem;
      color: #58a6ff;
      font-weight: bold;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }

    /* Griglia Orologi e Schede Giornaliere */
    .section-title {
      max-width: 1300px;
      margin: 0 auto 20px auto;
      font-size: 1.2rem;
      color: #ffffff;
      border-bottom: 1px solid #212936;
      padding-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .grid-container {
      display: flex;
      flex-direction: column;
      gap: 30px;
      max-width: 1300px;
      margin: 0 auto;
    }
    .day-card {
      background: #121721;
      border: 1px solid #212936;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 1px solid #1a212d;
      padding-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .date-badge {
      background: #1a212d;
      color: #58a6ff;
      border: 1px solid #2a3446;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .day-total-badge {
      color: #38ef7d;
      font-weight: 600;
      font-size: 1rem;
    }

    /* Layout Triplo Orologio */
    .clocks-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }
    .clock-box {
      background: #0b0e14;
      border: 1px solid #1f2733;
      border-radius: 16px;
      padding: 15px;
      text-align: center;
    }
    .clock-title {
      font-size: 0.85rem;
      color: #788ba6;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    .chart-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto;
    }
    .chart-center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255,255,255,0.2);
    }

    /* Dettaglio Fasce Orarie */
    .fasce-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      background: #0b0e14;
      border-radius: 12px;
      padding: 15px;
      border: 1px solid #1f2733;
    }
    .fascia-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .fascia-label {
      font-size: 0.78rem;
      color: #788ba6;
      text-transform: uppercase;
      font-weight: 600;
    }
    .fascia-val {
      font-size: 1rem;
      color: #e1e6ed;
      font-weight: bold;
    }
    .fascia-bar-bg {
      height: 6px;
      background: #1a212d;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 2px;
    }
    .fascia-bar-fill {
      height: 100%;
      border-radius: 3px;
    }

    .loading-state {
      text-align: center;
      font-size: 1.1rem;
      color: #788ba6;
      margin-top: 50px;
    }
  </style>
</head>
