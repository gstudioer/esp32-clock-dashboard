<html lang="it">

  <style>
    body {

      box-sizing: border-box;
    }

      text-align: center;
      margin-bottom: 35px;
    }
    h1 {

      color: #38ef7d;

      letter-spacing: 2px;

    }
    p.subtitle {
      color: #788ba6;
      font-size: 0.95rem;
      margin: 0 0 18px 0;
    }
    .drive-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #1a212d;
      color: #38ef7d;
      border: 1px solid #38ef7d;
      padding: 8px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .drive-link-btn:hover {

      color: #0b0e14;
      box-shadow: 0 0 12px rgba(56, 239, 125, 0.4);
    }
    
    .analytics-section {
      max-width: 1300px;
      margin: 0 auto 40px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
    }
    .analytics-card {
      background: #121721;
      border: 1px solid #212936;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .analytics-title {
      font-size: 1.05rem;
      color: #58a6ff;
      font-weight: bold;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }

    .section-title {
      max-width: 1300px;
      margin: 0 auto 20px auto;
      font-size: 1.2rem;
      color: #ffffff;
      border-bottom: 1px solid #212936;
      padding-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .grid-container {
      display: flex;
      flex-direction: column;
      gap: 30px;
      max-width: 1300px;
      margin: 0 auto;
    }
    .day-card {
      background: #121721;
      border: 1px solid #212936;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 1px solid #1a212d;
      padding-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .date-badge {
      background: #1a212d;
      color: #58a6ff;
      border: 1px solid #2a3446;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .day-total-badge {
      color: #38ef7d;
      font-weight: 600;
      font-size: 1rem;
    }

    .clocks-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }
    .clock-box {
      background: #0b0e14;
      border: 1px solid #1f2733;
      border-radius: 16px;
      padding: 15px;
      text-align: center;
    }
    .clock-title {
      font-size: 0.85rem;
      color: #788ba6;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    .chart-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto;
    }
    .chart-center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255,255,255,0.2);
    }

    .fasce-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      background: #0b0e14;
      border-radius: 12px;
      padding: 15px;
      border: 1px solid #1f2733;
    }
    .fascia-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .fascia-label {
      font-size: 0.78rem;
      color: #788ba6;
      text-transform: uppercase;
      font-weight: 600;
    }
    .fascia-val {
      font-size: 1rem;
      color: #e1e6ed;
      font-weight: bold;
    }
    .fascia-bar-bg {
      height: 6px;
      background: #1a212d;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 2px;
    }
    .fascia-bar-fill {
      height: 100%;
      border-radius: 3px;
    }

    .loading-state {
      text-align: center;
      font-size: 1.1rem;
      color: #788ba6;
      margin-top: 50px;
    }
  </style>
</head>

  <div id="analyticsWrapper" style="display: none;">

      <div class="analytics-card">
        <div class="analytics-title">Ore Attive per Giorno (Totale)</div>
        <canvas id="barChartDays"></canvas>
      </div>
      <div class="analytics-card">
        <div class="analytics-title">Ripartizione Utilizzo Complessiva per Fasce</div>
        <canvas id="pieChartFasce"></canvas>
      </div>

    <div id="clocksGrid" class="grid-container"></div>
  </div>

  <script>
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzv_3rDgWIRFjMB8kEwDuTf2FSs8_0BBiw3CjwY-mew4vzMY3OqYMcO0vWB6uWl5wpt/exec?get_data=true";

    let barChartInstance = null;
    let pieChartInstance = null;

    function loadDataFromDrive() {
      const oldScript = document.getElementById('jsonp-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'jsonp-script';
      script.src = WEBHOOK_URL + "&callback=processAndRender&t=" + new Date().getTime();
      document.body.appendChild(script);
    }

    function parseHour(timeStr) {
      if (!timeStr) return -1;
      let str = String(timeStr).trim();
      if (str.includes("T")) str = str.split("T")[1];
      const parts = str.split(":");
      if (parts.length >= 1) {
        const h = parseInt(parts[0], 10);
        if (!isNaN(h) && h >= 0 && h < 24) return h;
      }
      return -1;
    }

    function parseDate(dateVal) {
      if (!dateVal) return "";
      let str = String(dateVal).trim();
      if (str.includes("T")) str = str.split("T")[0];
      return str;
    }

    function processAndRender(data) {
      document.getElementById("loading").style.display = "none";
      document.getElementById("analyticsWrapper").style.display = "block";

      if (!data || !Array.isArray(data) || data.length < 2) return;

      const dailyMap = {};

      for (let i = 1; i < data.length; i++) {
        const rowDate = parseDate(data[i][0]);
        const startTimeStr = String(data[i][1] || "");
        const endTimeStr = String(data[i][2] || "");
        const activeMins = parseInt(data[i][3], 10) || 0;

        if (rowDate && !rowDate.includes("TOTALE") && rowDate !== "DATA") {
          if (!dailyMap[rowDate]) {
            dailyMap[rowDate] = {
              hourly: new Array(24).fill(false),
              totalMins: 0
            };
          }

          dailyMap[rowDate].totalMins += activeMins;

          const startHour = parseHour(startTimeStr);
          const endHour = parseHour(endTimeStr);

          if (startHour !== -1 && endHour !== -1) {
            for (let h = startHour; h <= endHour; h++) {
              if (h >= 0 && h < 24) {
                dailyMap[rowDate].hourly[h] = true;
              }
            }
          }
        }
      }

      const sortedDates = Object.keys(dailyMap).sort();

      renderAnalyticsCharts(sortedDates, dailyMap);
      renderClockCards(sortedDates.slice().reverse(), dailyMap);
    }

      const labelsDays = dates;
      const dataHoursDays = dates.map(d => (dailyMap[d].totalMins / 60).toFixed(1));

      if (barChartInstance) barChartInstance.destroy();
      const ctxBar = document.getElementById('barChartDays').getContext('2d');
      barChartInstance = new Chart(ctxBar, {
        type: 'bar',
        data: {
          labels: labelsDays,
          datasets: [{
            label: 'Ore Attive',
            data: dataHoursDays,
            backgroundColor: '#38ef7d',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#788ba6' }, grid: { color: '#1a212d' } },
            y: { ticks: { color: '#788ba6' }, grid: { color: '#1a212d' } }
          }
        }
      });

      let notte = 0, mattina = 0, pomeriggio = 0, sera = 0;

      dates.forEach(d => {
        dailyMap[d].hourly.forEach((isActive, hour) => {
          if (isActive) {
            if (hour >= 0 && hour < 6) notte++;
            else if (hour >= 6 && hour < 12) mattina++;
            else if (hour >= 12 && hour < 18) pomeriggio++;
            else sera++;
          }
        });
      });
